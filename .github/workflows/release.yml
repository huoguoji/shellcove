name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: 交叉编译并发布
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 构建前端
        run: |
          cd web
          npm ci
          npm run build

      - name: 打包（复用 deploy/build.sh）
        run: SKIP_WEB=1 bash deploy/build.sh

      - name: 汇总产物
        run: |
          ls -lh dist/
          cat dist/SHA256SUMS

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
          draft: false
